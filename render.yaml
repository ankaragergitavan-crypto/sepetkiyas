services:
  - type: web
    name: sepetkiyas
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: ACCESS_PIN
        sync: false
      - key: STRICT_PRIVACY
        value: "1"
      - key: ALLOWED_IPS
        sync: false
